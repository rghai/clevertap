<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major Cineplex × CleverTap × Reshape | Interactive Journey Lab</title>
<meta name="description" content="Interactive CleverTap cinema engagement campaign concepts: discovery, daily check-ins, streaks, quests, rewards and loyalty. Bilingual Thai and English.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0b0e;--card:#1d1a21;--muted:#bbb1b2;--line:#46373b;--accent:#efa85c;--light:#fff3e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 60% 35% at 95% 0,#39231a,transparent),linear-gradient(#101017,#0d0b0e);color:var(--light);font:15px/1.6 Kanit,system-ui,sans-serif}
a{color:var(--accent)}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1410px;margin:auto;padding:22px 30px;border-bottom:1px solid var(--line)}
.brands{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.brand{background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:7px 14px;min-width:130px;height:65px}
.brand.major{min-width:75px}.brand.major img{height:55px;width:43px;object-fit:contain}.brand.clevertap img{height:43px;max-width:195px;object-fit:contain}.brand.reshape{background:#f4ecff}.brand.reshape img{width:176px;max-height:52px;object-fit:contain}
.brand-sep{font-size:20px;color:#987d75}.lang{display:flex;border:1px solid #6d5146;border-radius:11px;padding:4px;background:#1f1920;white-space:nowrap}.lang button{background:transparent;border:0;color:#bbb;padding:8px 15px;border-radius:8px}.lang button[aria-pressed="true"]{background:#e8a75c;color:#21140e;font-weight:700}
main{max-width:1350px;padding:48px 24px 90px;margin:auto}.eyebrow{text-transform:uppercase;color:var(--accent);letter-spacing:.16em;font-size:12px;font-weight:700}.intro{max-width:930px}h1{font-size:clamp(36px,5vw,68px);line-height:1.12;letter-spacing:-.025em;margin:13px 0 17px}h1 em{color:var(--accent);font-style:normal}.intro p{color:#d1c1bd;font-size:17px;max-width:830px;margin:0}
.counters{display:flex;flex-wrap:wrap;gap:14px;margin:27px 0 36px}.counter{border:1px solid #544037;background:#211b1f;border-radius:12px;padding:8px 16px;color:#dfc4a8;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(370px,1fr) 450px;gap:34px;align-items:start}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid #594849;border-radius:100px;padding:9px 13px;background:#1c1920;color:#cbbbbb;font-size:12px}.filter[aria-pressed="true"]{color:#201711;background:var(--accent);border-color:var(--accent);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{background:linear-gradient(120deg,#211c22,#19171e);border:1px solid #40353d;color:inherit;border-radius:19px;padding:21px;text-align:left;min-height:197px;transition:background .15s,border-color .15s,transform .15s;position:relative}.tile:hover{border-color:#bd8551;transform:translateY(-2px)}.tile[aria-selected="true"]{border-color:#eaaa60;background:linear-gradient(125deg,#35251e,#231c26);box-shadow:0 0 0 1px #b98753 inset}.tile[hidden]{display:none}.index{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.1em}.tile .emoji{font-size:28px;position:absolute;right:18px;top:16px}.tile b{font-size:18px;line-height:1.25;display:block;margin:11px 0}.tile p{font-size:12px;line-height:1.55;color:#c6b9b8;margin:0}.tile small{font-size:10px;display:inline-block;color:#ddb888;margin-top:12px}
.preview{position:sticky;top:20px;text-align:center}.device{width:min(100%,398px);margin:auto;border:10px solid #3f3636;border-radius:44px;background:#0b0b10;box-shadow:0 20px 80px #000c,0 0 0 1px #76563d inset;overflow:hidden}.status{height:34px;color:#ddd;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:11px}.device iframe{display:block;width:100%;height:690px;border:0;background:#11111b}.cap{color:#dbcbc8;font-size:13px;margin:14px 0}.open{display:inline-flex;gap:8px;align-items:center;background:var(--accent);color:#251508;padding:9px 16px;border-radius:9px;font-weight:700;text-decoration:none;font-size:13px}
.event{margin:15px auto 0;max-width:398px;text-align:left;border:1px dashed #624c42;border-radius:12px;padding:10px 14px;color:#9f9899;font-size:11px;overflow-wrap:anywhere}.event b{color:var(--accent)}.notice{border-top:1px solid var(--line);color:#a8a0a1;font-size:12px;margin-top:50px;padding-top:19px;line-height:1.8}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.preview{position:static}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){header{padding:13px;gap:10px;align-items:flex-start}.brands{gap:4px}.brand{height:38px;min-width:74px;padding:5px}.brand.major{min-width:42px}.brand.major img{height:32px}.brand.clevertap img{max-width:88px;max-height:28px}.brand.reshape img{max-width:92px;max-height:28px}.brand-sep{display:none}.lang button{padding:4px 8px;font-size:12px}main{padding:27px 14px 50px}.cards{grid-template-columns:1fr}.tile{min-height:130px}.device iframe{height:610px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style></head><body>
<header><div class="brands" aria-label="Brand logos"><div class="brand major"><img alt="Major Cineplex official logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Major_Cineplex_Logo.svg"></div><span class="brand-sep">×</span><div class="brand clevertap"><img alt="CleverTap official logo" src="https://raw.githubusercontent.com/CleverTap/clevertap-ios-sdk/master/docs/images/clevertap-logo.png"></div><span class="brand-sep">×</span><div class="brand reshape"><img alt="Reshape Consulting official logo" src="assets/reshape-logo.svg"></div></div><div class="lang" role="group" aria-label="Language"><button type="button" id="en" aria-pressed="true">EN</button><button type="button" id="th" aria-pressed="false">ไทย</button></div></header>
<main><section class="intro"><div class="eyebrow" data-t="eyebrow"></div><h1 id="heroTitle"></h1><p data-t="lead"></p><div class="counters"><span class="counter" data-t="count1"></span><span class="counter" data-t="count2"></span><span class="counter" data-t="count3"></span></div></section>
<div class="layout"><section aria-label="Demo selection"><div class="filters" id="filters" role="group" aria-label="Journey category"></div><div class="cards" id="cards"></div></section><aside class="preview"><div class="device"><div class="status"><span>9:41</span><span>●●●  100%</span></div><iframe id="phone" title="Interactive Major Cineplex journey demo" src="engagement.html?mode=checkin&amp;lang=th" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></div><div class="cap" id="caption"></div><a id="open" class="open" target="_blank" rel="noopener" href="engagement.html?mode=checkin&amp;lang=th"><span data-t="full"></span> ↗</a><div class="event" aria-live="polite"><span data-t="event"></span><b id="eventName">—</b></div></aside></div>
<footer class="notice"><span data-t="disclaimer"></span><p><span data-t="credit"></span> <a href="https://github.com/shijunneo-bot/ct-template-gallery" target="_blank" rel="noopener">SJ Neo CleverTap Custom HTML Gallery</a>. Major Cineplex logo: <a href="https://commons.wikimedia.org/wiki/File:Major_Cineplex_Logo.svg" target="_blank" rel="noopener">Wikimedia Commons</a>. CleverTap logo: <a href="https://github.com/CleverTap/clevertap-ios-sdk" target="_blank" rel="noopener">CleverTap GitHub</a>. Reshape logo: first-party brand asset.</p></footer></main>
<script>
(function(){
'use strict';
const items=[
{id:'checkin',file:'engagement.html?mode=checkin',group:'habit',emoji:'🔥',en:['Daily check-in & streak','One-tap daily habit, 7-day milestone and streak progress.'],th:['เช็กอินรายวันและนับสตรีก','เปิดแอปทุกวัน เช็กอินครั้งเดียว สะสมสตรีกและรับโบนัสเมื่อครบ 7 วัน']},
{id:'quests',file:'engagement.html?mode=quests',group:'habit',emoji:'🎯',en:['Daily app missions','Micro-quests for movie discovery, watchlists and showtime browsing.'],th:['ภารกิจในแอปประจำวัน','ชวนสำรวจหนัง บันทึกเรื่องโปรด และค้นหารอบฉายทุกวัน']},
{id:'quiz',file:'engagement.html?mode=quiz',group:'habit',emoji:'🧠',en:['Daily cinema trivia','A rotating question and a small participation reward each day.'],th:['ควิซหนังประจำวัน','คำถามใหม่ทุกวัน พร้อมดาวสำหรับคนร่วมสนุก']},
{id:'scratch',file:'engagement.html?mode=scratch',group:'habit',emoji:'🎟️',en:['Scratch & reveal','An interactive mystery reward with a once-per-day limit.'],th:['การ์ดขูดลุ้นเซอร์ไพรส์','ขูดการ์ดลุ้นดาวตัวอย่าง จำกัดวันละครั้ง']},
{id:'wheel',file:'engagement.html?mode=wheel',group:'habit',emoji:'🎡',en:['Daily surprise wheel','A repeat-visit ritual with sample wheel prizes.'],th:['วงล้อเซอร์ไพรส์รายวัน','เปิดแอปมาหมุนวงล้อสะสมดาวตัวอย่างวันละครั้ง']},
{id:'carousel',file:'templates/01-now-showing-carousel.html',group:'conversion',emoji:'🎬',en:['Personalised movie discovery','Swipeable film recommendations to turn browsing into bookings.'],th:['แนะนำหนังที่ตรงใจ','เลื่อนดูหนังแนะนำและค้นหาเรื่องที่อยากจอง']},
{id:'poll',file:'templates/02-genre-poll.html',group:'conversion',emoji:'💬',en:['Genre preference poll','Collect declared genre preference for richer segmentation.'],th:['โหวตแนวหนังที่ชอบ','เก็บความสนใจเพื่อสร้างกลุ่มลูกค้าและแคมเปญ']},
{id:'recovery',file:'templates/03-checkout-recovery.html',group:'conversion',emoji:'🎫',en:['Ticket checkout recovery','Rescue a booking journey with a timely in-app reminder.'],th:['กลับมาจองตั๋วที่ค้างไว้','แจ้งเตือนผู้ใช้ให้กลับมาดำเนินการจองต่อ']},
{id:'passport',file:'engagement.html?mode=passport',group:'loyalty',emoji:'🛂',en:['Cinema visit passport','Earn stamps on verified visits and celebrate milestones.'],th:['พาสปอร์ตสะสมการดูหนัง','รับตราประทับจากการดูหนังที่ยืนยันแล้วและสะสมให้ครบ']},
{id:'badges',file:'templates/04-major-rewards-badges.html',group:'loyalty',emoji:'🏅',en:['Movie milestone badges','Recognition for discovery, loyalty and repeat visits.'],th:['เหรียญรางวัลคนรักหนัง','มอบรางวัลเชิงสัญลักษณ์เมื่อทำภารกิจหรือเข้าชมครบ']},
{id:'recap',file:'templates/05-cinema-year-recap.html',group:'loyalty',emoji:'✨',en:['Personal cinema-year recap','Create a shareable personalised retention moment.'],th:['สรุปปีแห่งการดูหนัง','เล่าเรื่องสถิติการดูหนังของสมาชิกแบบแชร์ต่อได้']}
];
const W={
en:{eyebrow:'INTERACTIVE ENGAGEMENT CONCEPT LAB',h1a:'Turn cinema fans into',h1b:'everyday app users.',lead:'From movie discovery and booking conversion to daily check-ins, playful mini-games and loyalty. Explore 11 interactive CleverTap-inspired experiences adapted for Major Cineplex.',count1:'11 interactive experiences',count2:'6 gamification journeys',count3:'Thai + English',all:'All journeys',habit:'Daily app usage',conversion:'Ticket journey',loyalty:'Loyalty & cinema visits',full:'Open full-screen demo',event:'Latest demo event: ',disclaimer:'Concept demonstration only, not an official Major Cineplex service or live CleverTap campaign. Stars, rewards, visits, votes and film titles are fictional. No real coupon, payment or ticket is issued. The new gamification examples persist progress in browser storage for demonstration only. Production must use server-side validation and fulfilment.',credit:'Original five template patterns adapted from'},
th:{eyebrow:'ตัวอย่างประสบการณ์ลูกค้าผ่านแอป',h1a:'จากคนรักหนัง',h1b:'สู่คนเปิดแอปทุกวัน',lead:'ตัวอย่างแคมเปญสำหรับ Major Cineplex ตั้งแต่การแนะนำหนังและกระตุ้นการจอง ไปจนถึงเช็กอินรายวัน เกมสนุก ๆ และกิจกรรมสมาชิก รวม 11 ประสบการณ์ที่กดเล่นได้จริงในโหมดตัวอย่าง',count1:'11 ประสบการณ์แบบโต้ตอบ',count2:'6 เส้นทางเกมและสะสมแต้ม',count3:'ไทย + English',all:'ทุกเส้นทาง',habit:'กลับมาใช้แอปทุกวัน',conversion:'ค้นหาหนังและจองตั๋ว',loyalty:'ความภักดีและมาโรงหนัง',full:'เปิดตัวอย่างเต็มจอ',event:'เหตุการณ์ตัวอย่างล่าสุด: ',disclaimer:'เป็นเพียงต้นแบบแนวคิด ไม่ใช่บริการจริงของ Major Cineplex หรือแคมเปญ CleverTap ที่เปิดใช้งาน ดาว รางวัล ประวัติการมาใช้บริการ และชื่อหนังเป็นข้อมูลสมมติ ไม่มีคูปอง การชำระเงิน หรือตั๋วหนังจริง เกมใหม่บันทึกความคืบหน้าไว้ในเบราว์เซอร์เฉพาะการสาธิต การใช้งานจริงต้องตรวจสอบสิทธิ์และแจกรางวัลผ่านเซิร์ฟเวอร์',credit:'ต้นแบบ 5 รายการแรกดัดแปลงจาก'}
};
const selected={id:'checkin',filter:'all'};let lang=localStorage.getItem('major-demo-lang')==='en'?'en':'th';
const byId=id=>items.find(i=>i.id===id);
function tr(k){return W[lang][k]||k}
function full(item){return item.file+(item.file.includes('?')?'&':'?')+'lang='+lang}
function render(){
document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(x=>x.textContent=tr(x.dataset.t));
document.getElementById('heroTitle').innerHTML=tr('h1a')+'<br><em>'+tr('h1b')+'</em>';
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===lang)));
const filters=document.getElementById('filters');filters.innerHTML='';for(const k of ['all','habit','conversion','loyalty']){const b=document.createElement('button');b.className='filter';b.textContent=tr(k);b.setAttribute('aria-pressed',String(selected.filter===k));b.onclick=()=>{selected.filter=k;render()};filters.append(b)}
const cards=document.getElementById('cards');cards.innerHTML='';
items.forEach((item,i)=>{if(selected.filter!=='all'&&item.group!==selected.filter)return;const b=document.createElement('button');b.className='tile';b.setAttribute('aria-selected',String(item.id===selected.id));const words=item[lang];b.innerHTML='<span class="index">'+String(i+1).padStart(2,'0')+' · '+tr(item.group)+'</span><span class="emoji" aria-hidden="true">'+item.emoji+'</span><b>'+words[0]+'</b><p>'+words[1]+'</p><small>'+ (item.file.includes('engagement')?'INTERACTIVE DEMO':'CLEVERTAP HTML TEMPLATE')+'</small>';b.onclick=()=>{selected.id=item.id;render()};cards.append(b)});
const active=byId(selected.id);document.getElementById('caption').textContent=active[lang][0];const url=full(active);document.getElementById('open').href=url;
const phone=document.getElementById('phone');if(phone.getAttribute('src')!==url)phone.setAttribute('src',url);
}
document.getElementById('en').onclick=()=>{lang='en';localStorage.setItem('major-demo-lang',lang);render()};
document.getElementById('th').onclick=()=>{lang='th';localStorage.setItem('major-demo-lang',lang);render()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='major-cineplex-demo')return;document.getElementById('eventName').textContent=e.data.event||'—'});
const requested=new URLSearchParams(location.search);if(requested.get('lang')==='th'||requested.get('lang')==='en')lang=requested.get('lang');if(items.some(i=>i.id===requested.get('demo')))selected.id=requested.get('demo');render();
})();
</script></body></html>
