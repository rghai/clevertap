<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Major | Booking Rescue</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0d12;--paper:#191920;--paper2:#222028;--gold:#f0b742;--dim:#a9a4aa;--border:#363138}
*{box-sizing:border-box}body{background:var(--bg);color:#f5f3f2;margin:0;font:14px/1.55 Kanit,system-ui,sans-serif;padding:24px 18px 30px}.head{display:flex;align-items:center;gap:9px;margin-bottom:30px}.head img{width:34px;height:40px;object-fit:contain;background:white;border-radius:7px;padding:3px}.head b{font-size:14px;letter-spacing:.07em}.demo{margin-left:auto;color:#e9c377;border:1px solid #746048;border-radius:40px;padding:3px 6px;font-size:9px}.eyebrow{color:#e7b36b;font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}.hero{text-align:center;padding:8px 4px 18px}.icon{font-size:46px;line-height:1.2}.hero h1{font-size:25px;line-height:1.3;margin:10px auto;max-width:340px}.hero p{font-size:13px;color:#b7adb5;margin:9px auto;max-width:300px}.clock{margin:12px auto 20px;border:1px solid #59433d;border-radius:16px;background:linear-gradient(125deg,#302023,#231d26);padding:16px;text-align:center}.clock strong{font-size:33px;letter-spacing:.08em;display:block;font-variant-numeric:tabular-nums}.clock small{color:#e7b9ab;font-size:11px}.card{border:1px solid var(--border);background:var(--paper);border-radius:16px;padding:15px;margin-bottom:13px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.title b{font-size:15px}.title small{font-size:10px;color:#d5b47c}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #302e34;padding:11px 0}.row:last-child{border:0}.row span{color:#bbb3b7;font-size:12px}.row b{text-align:right;font-size:12px;font-weight:600}.snack{display:flex;gap:10px;align-items:center}.snack .emoji{font-size:29px}.snack b{font-size:13px}.snack small{color:#ada6a9;font-size:11px;display:block}.snack button{margin-left:auto;background:#49372a;border:1px solid #b68345;color:#f6cb85;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}.snack button[aria-pressed="true"]{background:#d7a64e;color:#231611}.primary{width:100%;border:0;border-radius:11px;background:#f1b93d;color:#281b09;padding:13px;font-weight:700;font-size:15px;cursor:pointer}.secondary{width:100%;border:1px solid #6b5550;color:#e2c8c1;background:transparent;border-radius:10px;padding:10px;margin-top:10px;cursor:pointer}.notice{margin-top:14px;color:#aea4a8;font-size:11px;text-align:center}.result{color:#f3cf82;background:#2a251c;padding:13px;border:1px solid #6a5035;border-radius:12px;margin:12px 0;text-align:center}button:focus-visible{outline:3px solid white;outline-offset:2px}
</style></head><body>
<div class="head"><img alt="Major Cineplex" src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Major_Cineplex_Logo.svg"><b>MAJOR CINEPLEX</b><span class="demo">DEMO</span></div>
<section class="hero"><div class="icon">🎟️</div><div class="eyebrow" id="tag"></div><h1 id="headline"></h1><p id="sub"></p></section>
<div class="clock"><small id="clockLabel"></small><strong id="clock">08:00</strong><small id="clockFoot"></small></div>
<div class="card"><div class="title"><b id="bookingTitle"></b><small id="sample"></small></div><div class="row"><span id="filmKey"></span><b id="film"></b></div><div class="row"><span id="branchKey"></span><b id="branch"></b></div><div class="row"><span id="showKey"></span><b id="show"></b></div><div class="row"><span id="seatKey"></span><b id="seats"></b></div><div class="row"><span id="memberKey"></span><b id="member"></b></div></div>
<div class="card"><div class="title"><b id="snackTitle"></b><small id="snackHint"></small></div><div class="snack"><span class="emoji">🍿🥤</span><div><b id="combo"></b><small id="comboDesc"></small></div><button id="add" aria-pressed="false"></button></div></div>
<div class="card"><div class="row"><span id="ticketCostLabel"></span><b id="ticketCost"></b></div><div class="row"><span id="snackCostLabel"></span><b id="snackCost"></b></div><div class="row"><span id="totalLabel"></span><b id="total"></b></div></div>
<button class="primary" id="continue"></button><button class="secondary" id="remind"></button><div id="result" role="status"></div>
<div class="notice" id="note"></div>
<script>
(function(){
const lang=new URLSearchParams(location.search).get('lang')==='th'?'th':'en';
document.documentElement.lang=lang;
const D={
en:{tag:'BOOKING RECOVERY',headline:'Your seats are waiting',sub:'You left a cinema booking unfinished. Return to complete your selection before your seat hold ends.',clockLabel:'ILLUSTRATIVE SEAT HOLD TIMER',clockFoot:'Demo only. Actual seat holds depend on ticketing rules.',bookingTitle:'Your unfinished booking',sample:'SAMPLE DETAILS',filmKey:'Movie',branchKey:'Cinema',showKey:'Showtime',seatKey:'Your seats',memberKey:'Membership',film:'The Last Horizon',branch:'Major Ratchayothin',show:'Today · 19:30',seats:'G10, G11',member:'M GEN · sample only',snackTitle:'Complete your movie night',snackHint:'OPTIONAL ADD-ON',combo:'Popcorn & 2 drinks',comboDesc:'Pick up before the show · sample ฿169',add:'Add +',added:'Added ✓',ticketCostLabel:'Tickets · example',snackCostLabel:'Snacks · example',totalLabel:'Illustrative total',continue:'Continue booking',remind:'Remind me later',complete:'Demo journey: booking and snack selections are ready. No real payment, hold or ticket was created.',reminded:'Demo reminder selected. No actual notification scheduled.',note:'Concept only: sample movie, seats, prices and benefits. No live inventory, actual checkout or CleverTap connection.'},
th:{tag:'กลับมาจองตั๋วต่อ',headline:'ที่นั่งที่เลือกไว้กำลังรอคุณ',sub:'คุณยังทำรายการจองตั๋วไม่เสร็จ กลับมาดำเนินการต่อก่อนหมดเวลาถือที่นั่ง',clockLabel:'เวลาจำลองการถือที่นั่ง',clockFoot:'เป็นตัวอย่างเท่านั้น เวลาจริงเป็นไปตามเงื่อนไขระบบจอง',bookingTitle:'รายการจองที่ค้างไว้',sample:'ข้อมูลสมมติ',filmKey:'ภาพยนตร์',branchKey:'โรงภาพยนตร์',showKey:'รอบฉาย',seatKey:'ที่นั่ง',memberKey:'สมาชิก',film:'The Last Horizon',branch:'เมเจอร์ รัชโยธิน',show:'วันนี้ · 19:30 น.',seats:'G10, G11',member:'M GEN · ตัวอย่าง',snackTitle:'เติมความฟินก่อนดูหนัง',snackHint:'เพิ่มได้ตามต้องการ',combo:'ป๊อปคอร์นและเครื่องดื่ม 2 แก้ว',comboDesc:'รับก่อนรอบฉาย · ราคาเริ่มสมมติ ฿169',add:'เพิ่ม +',added:'เพิ่มแล้ว ✓',ticketCostLabel:'ตั๋วหนัง · ราคาตัวอย่าง',snackCostLabel:'ของทานเล่น · ราคาตัวอย่าง',totalLabel:'ราคารวมสมมติ',continue:'กลับไปทำรายการจอง',remind:'เตือนฉันทีหลัง',complete:'ตัวอย่าง: เลือกตั๋วและของทานเล่นแล้ว ยังไม่มีการชำระเงินจริงหรือออกตั๋ว',reminded:'ตัวอย่าง: เลือกรับการแจ้งเตือน แต่ยังไม่มีการตั้งส่งจริง',note:'ต้นแบบเท่านั้น ภาพยนตร์ ที่นั่ง ราคาและสิทธิ์เป็นข้อมูลสมมติ ไม่มีการถือที่นั่งจริงหรือเชื่อม CleverTap'}
};
const t=k=>D[lang][k],id=x=>document.getElementById(x);
['tag','headline','sub','clockLabel','clockFoot','bookingTitle','sample','filmKey','film','branchKey','branch','showKey','show','seatKey','seats','memberKey','member','snackTitle','snackHint','combo','comboDesc','ticketCostLabel','snackCostLabel','totalLabel','continue','remind','note'].forEach(k=>id(k).textContent=t(k));
let added=false,secs=8*60;function update(){id('add').textContent=t(added?'added':'add');id('add').setAttribute('aria-pressed',String(added));id('ticketCost').textContent='฿480';id('snackCost').textContent=added?'฿169':'฿0';id('total').textContent='฿'+(480+(added?169:0));}update();
function emit(event,props){if(window.parent!==window)window.parent.postMessage({source:'major-cineplex-demo',event,properties:props||{}},location.origin);}
id('add').onclick=()=>{added=!added;update();emit('Major_Concession_CrossSell_Toggled',{added,scenario:'booking_recovery'})};
id('continue').onclick=()=>{id('result').className='result';id('result').textContent=t('complete');emit('Major_Booking_Recovery_Clicked',{with_combo:added})};
id('remind').onclick=()=>{id('result').className='result';id('result').textContent=t('reminded');emit('Major_Booking_Reminder_Simulated',{with_combo:added})};
setInterval(()=>{if(secs>0)secs--;id('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000);
emit('Major_Booking_Recovery_Viewed');
})();
</script></body></html>
