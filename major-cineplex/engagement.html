function renderCheckin(){const checked=s.lastCheckin===today();const dayCount=(s.lastCheckin&&diffDays(s.lastCheckin,today())<=1)?s.streak:0;const active=dayCount?((dayCount-1)%7)+1:0;let days='<div class="days" aria-label="'+t('week')+'">';for(let i=1;i<=7;i++)days+='<div class="day '+(i<=active?'on':'')+'">'+(i<=active?'✓':i)+'<span>'+t('days')+'</span></div>';days+='</div>';panel('checkinLead','<div class="big" aria-hidden="true">🔥</div>'+days+'<p>'+t('milestone')+'</p><button id="claim" class="cta" '+(checked?'disabled':'')+'>'+t(checked?'done':'claim')+'</button>'+(checked?note(t('dayDone')):''));const b=el('claim');if(!checked)b.onclick=()=>{if(s.lastCheckin===today())return;const d=s.lastCheckin?diffDays(s.lastCheckin,today()):0;s.streak=d===1?s.streak+1:1;s.best=Math.max(s.best,s.streak);s.lastCheckin=today();reward(10,'Major_Daily_Checkin');if(s.streak%7===0)reward(30,'Major_Checkin_Milestone');render()}}
function renderQuests(){const done=s.quests[today()]||[];const ids=['browse','watchlist','showtimes'];let html='<p>'+t('questInfo')+'</p>';for(let i=0;i<3;i++){const k=ids[i],complete=done.includes(k);html+='<div class="quest"><span class="ic">'+['🎬','❤️','🕒'][i]+'</span><div><b>'+t(k)+'</b><small>'+t(k+'D')+'</small></div><button type="button" data-task="'+k+'" '+(complete?'disabled':'')+'>'+t(complete?'finished':'do')+'</button></div>'}if(done.length===3)html+=note(t('questReward'));panel('questsLead',html);document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const k=b.dataset.task;const a=s.quests[today()]||[];if(a.includes(k))return;s.quests[today()]=[...a,k];track('Major_Quest_Action_Simulated',{task:k,date:today()});if(s.quests[today()].length===3)reward(20,'Major_Daily_Quest_Completed');save();render()})}
function renderQuiz(){const d=today(),result=s.quiz[d];const i=Number(d.slice(-2))%3;let html='';if(result){html=note(t('quizDone'))+'<div class="result">'+t(result.correct?'correct':'incorrect')+'</div>'}else{html='<p>'+t('quizQ')[i]+'</p>';t('quizOptions')[i].forEach((o,n)=>html+='<button class="choice" data-answer="'+n+'">'+o+'</button>')}panel('quizLead',html);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(s.quiz[d])return;const correct=Number(b.dataset.answer)===t('quizRight')[i];s.quiz[d]={answer:Number(b.dataset.answer),correct};reward(correct?10:2,'Major_Daily_Trivia_Answered');save();render()})}
function hashDay(d){let h=17;for(const c of d)h=((h*31)+c.charCodeAt(0))>>>0;return h}
function renderScratch(){const r=s.scratch[today()];const prize=[5,10,15][hashDay(today())%3];let html='<p>'+t('scratchHint')+'</p><div class="scratch-shell"><div class="scratch-win"><div class="emoji">🎟️</div><strong>+'+(r||prize)+' ★</strong><small>'+t('scratchPrize')+'</small></div>'+(r?'':'<canvas id="scratchCanvas" aria-label="'+t('scratchReady')+'"></canvas>')+'</div>';if(r)html+=note(t('scratchDone'));else html+='<button id="reveal" class="minor" type="button">'+t('scratchAccessible')+'</button>';panel('scratchLead',html);if(r)return;const canvas=el('scratchCanvas'),ctx=canvas.getContext('2d');canvas.width=640;canvas.height=330;ctx.fillStyle='#e2ae63';ctx.fillRect(0,0,640,330);ctx.fillStyle='#56352b';ctx.font='bold 42px Kanit, sans-serif';ctx.textAlign='center';ctx.fillText(t('scratchReady'),320,173);let moves=0,drag=false;function finish(){if(s.scratch[today()])return;s.scratch[today()]=prize;reward(prize,'Major_Scratch_Revealed');render()}function draw(e){if(!drag)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,33,0,Math.PI*2);ctx.fill();if(++moves>24)finish()}canvas.addEventListener('pointerdown',e=>{drag=true;canvas.setPointerCapture(e.pointerId);draw(e)});canvas.addEventListener('pointermove',draw);canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);el('reveal').onclick=finish}
function renderWheel(){const result=s.wheel[today()];let html='<div class="wheelbox"><div class="pointer"></div><div class="wheel" id="wheelDisc"></div></div><button class="cta" id="spinBtn" '+(result?'disabled':'')+'>'+t(result?'spinUsed':'spin')+'</button><p>'+t('wheelNotes')+'</p>';if(result)html+=note(t('spinResult')+' +'+result+' ★');panel('wheelLead',html);if(!result)el('spinBtn').onclick=()=>{const b=el('spinBtn');b.disabled=true;const d=today(),prize=[2,5,10,5,15,8][hashDay(d)%6];const disc=el('wheelDisc');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;disc.style.transform='rotate('+(reduce?0:1440+(hashDay(d)%360))+'deg)';track('Major_Daily_Wheel_Spun',{date:d});setTimeout(()=>{if(s.wheel[d])return;s.wheel[d]=prize;reward(prize,'Major_Wheel_Demo_Reward');render()},reduce?0:3150)}}
function renderPassport(){let stamps='<div class="stamps">';for(let i=0;i<6;i++)stamps+='<div class="stamp '+(i<s.passport?'on':'')+'" aria-label="'+(i<s.passport?'Completed':'Empty')+'">'+(i<s.passport?'🎬':'✧')+'</div>';stamps+='</div>';let html='<p>'+s.passport+'/6 '+t('visit')+'</p>'+stamps+'<button id="passportBtn" class="cta" '+(s.passport>=6?'disabled':'')+'>'+t(s.passport>=6?'stampDone':'stampAction')+'</button><p>'+t('stampDesc')+'</p>';if(s.passport>=6)html+=note(t('stampComplete'));panel('passportLead',html);if(s.passport<6)el('passportBtn').onclick=()=>{s.passport++;track('Major_Passport_Visit_Simulated',{stamps:s.passport});if(s.passport>=6&&!s.passportAwarded){s.passportAwarded=true;reward(30,'Major_Passport_Milestone_Simulated')}save();render()}}
function render(){renderFrame();({checkin:renderCheckin,quests:renderQuests,quiz:renderQuiz,scratch:renderScratch,wheel:renderWheel,passport:renderPassport})[mode]()}
el('nextDay').onclick=()=>{s.offset=(s.offset||0)+1;track('Major_Demo_Day_Advanced',{offset:s.offset});save();render()};
el('resetDemo').onclick=()=>{s={...defaults,quests:{},quiz:{},scratch:{},wheel:{}};save();track('Major_Demo_Reset');render()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='major:locale')return;lang=e.data.lang==='en'?'en':'th';document.documentElement.lang=lang;render()});
render();track('Major_Game_Viewed',{mode,lang});
})();
</script></body></html>
