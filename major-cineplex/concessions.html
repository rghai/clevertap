};
const t=k=>D[lang][k]||k;
const products=[{id:'pop',emoji:'🍿',price:99},{id:'combo',emoji:'🍿🥤',price:169},{id:'nachos',emoji:'🧀',price:139},{id:'home',emoji:'🎬🍿',price:249}];
let selection=new Set(mode==='recommend'?['pop']:[]),windowChoice='time2',deliveryMethod='del';
function emit(name,data){if(window.parent!==window)window.parent.postMessage({source:'major-cineplex-demo',event:name,properties:{mode,...(data||{})}},location.origin)}
function money(n){return '฿'+n.toLocaleString('en-US')}function selectedTotal(){return products.reduce((v,p)=>v+(selection.has(p.id)?p.price:0),0)}
function movieBox(){return '<div class="card"><h2>'+t('movie')+'</h2><div class="movie"><div class="poster">🎬</div><div><b>'+t('movieName')+'</b><small>'+t('movieDetails')+'</small><small>🎟️ G10, G11</small></div></div></div>'}
function snacks(){return '<div class="card"><h2>'+t(mode==='booking'?'pick':'items')+'</h2><p>'+t('choose')+'</p>'+products.filter(p=>mode==='delivery'?['pop','combo','home'].includes(p.id):p.id!=='home').map(p=>'<div class="snack"><span class="snack-emoji">'+p.emoji+'</span><div><b>'+t(p.id)+'</b><small>'+t(p.id+'D')+'</small><small>'+money(p.price)+' · demo</small></div><button class="'+(selection.has(p.id)?'selected':'')+'" data-snack="'+p.id+'" aria-pressed="'+selection.has(p.id)+'">'+t(selection.has(p.id)?'remove':'add')+'</button></div>').join('')+'</div>'}
function summary(){let subtotal=selectedTotal(),ticket=mode==='booking'?480:0;return '<div class="card"><div class="row"><span>'+t('subTotal')+'</span><b>'+money(subtotal)+'</b></div>'+(mode==='booking'?'<div class="row"><span>'+t('tickets')+'</span><b>'+money(ticket)+'</b></div>':'')+'<div class="row"><span><strong>'+t('total')+'</strong></span><b>'+money(ticket+subtotal)+'</b></div></div>'}
function render(){const isDelivery=mode==='delivery',key=mode==='booking'?'booking':mode==='pickup'?'pickup':mode==='recommend'?'recommend':'delivery';$('phase').textContent=t(isDelivery?'phase2':'phase1');$('feature').textContent=isDelivery?'🏠🍿':mode==='pickup'?'⏰🍿':mode==='recommend'?'💛🍿':'🎟️🍿';$('eyebrow').textContent=t(isDelivery?'phase2':'phase1');$('title').textContent=t(key+'T');$('sub').textContent=t(key+'S');$('note').textContent=t('note');let h='';
if(mode!=='delivery')h+=movieBox();
if(mode==='recommend')h+='<div class="callout">💛 '+t('usual')+'</div>';
if(isDelivery)h+='<div class="callout">🏠 '+t('noTicket')+'</div>';
h+=snacks();
if(mode==='pickup'){h+='<div class="card"><h2>'+t('pickTime')+'</h2><div class="chips">'+['time1','time2','time3'].map(k=>'<button class="chip" data-time="'+k+'" aria-pressed="'+(windowChoice===k)+'">'+t(k)+'</button>').join('')+'</div></div>'}
if(isDelivery){h+='<div class="card"><h2>'+t('method')+'</h2><div class="chips">'+['del','collect'].map(k=>'<button class="chip" data-method="'+k+'" aria-pressed="'+(deliveryMethod===k)+'">'+t(k)+'</button>').join('')+'</div>'+(deliveryMethod==='del'?'<label class="muted" for="address">'+t('address')+'</label><input id="address" class="input" readonly value="'+t('addressP')+'"><p>🛵 '+t('partnerDesc')+'</p>':'<p>📍 Major Ratchayothin · '+t('collect')+'</p>')+'</div>'}
h+=summary();
if(mode==='booking')h+='<div class="callout">🎟️ '+t('vip')+'</div>';
h+='<button class="btn" id="submit">'+t(mode==='booking'?'checkout':mode==='pickup'?'pickupCta':mode==='recommend'?'recommendCta':'deliveryCta')+'</button><div id="result" role="status"></div>';$('main').innerHTML=h;
document.querySelectorAll('[data-snack]').forEach(b=>b.onclick=()=>{const id=b.dataset.snack;selection.has(id)?selection.delete(id):selection.add(id);emit('Major_Concession_Product_Toggled',{product:id,selected:selection.has(id),priority:isDelivery?'3.2':'3.1'});render()});
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{windowChoice=b.dataset.time;render()});
document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{deliveryMethod=b.dataset.method;render()});
$('submit').onclick=()=>{let id=isDelivery?'deliveryDone':mode==='booking'?'added':mode==='pickup'?'pickupDone':'recommendDone';$('result').innerHTML='<div class="result">'+t(id)+'</div>';emit(isDelivery?'Major_Popcorn_Delivery_Vision_Previewed':mode==='pickup'?'Major_Concession_Pickup_Previewed':mode==='recommend'?'Major_Concession_Personalised_Offer_Previewed':'Major_Concession_Checkout_CrossSell_Previewed',{products:[...selection],subtotal:selectedTotal(),time:windowChoice,fulfilment:isDelivery?deliveryMethod:'cinema',synthetic:true})}};
render();emit('Major_Concession_Demo_Viewed',{priority:mode==='delivery'?'3.2':'3.1'});
